<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة السر</title><style>body{font:17px Arial;background:#eef1f5;color:#203356;display:grid;place-items:center;min-height:95vh;margin:0}form{background:white;border-radius:18px;padding:32px;max-width:380px;width:80%;box-shadow:0 12px 45px #20335615}h1{font-size:24px}label{display:block;margin-top:24px}input,button{font:inherit;width:100%;box-sizing:border-box;padding:13px;border:1px solid #cbd5e1;border-radius:9px;margin-top:9px}button{background:#203356;color:white;cursor:pointer}p{line-height:1.7}#status{min-height:40px}a{color:#203356}</style><form id="changeForm"><h1>تغيير كلمة سر حسابك</h1><p>للمدير المسجل دخوله فقط. سيبقى اسم المستخدم كما هو.</p><label for="currentPassword">كلمة السر الحالية</label><input id="currentPassword" type="password" autocomplete="current-password" required maxlength="128"><label for="newPassword">كلمة السر الجديدة</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><label for="confirmPassword">تأكيد كلمة السر الجديدة</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button id="submitChange">حفظ كلمة السر</button><p id="status" role="status"></p><a href="/">العودة إلى المنصة</a></form><script>const f=document.getElementById('changeForm'),status=document.getElementById('status'),button=document.getElementById('submitChange');f.onsubmit=async e=>{e.preventDefault();if(newPassword.value!==confirmPassword.value){status.textContent='كلمتا السر غير متطابقتين';return}button.disabled=true;try{const r=await fetch('/api/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password:currentPassword.value,new_password:newPassword.value})});const j=await r.json();if(!r.ok)throw Error(j.error||'تعذر الحفظ');f.reset();status.textContent='تم تغيير كلمة السر. ارجع إلى المنصة وسجل الدخول بالجديدة.';button.hidden=true}catch(e){status.textContent=e.message;button.disabled=false}};</script></html>
